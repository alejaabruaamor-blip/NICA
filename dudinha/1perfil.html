<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil da Dudinha</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #111; }
    .banner img { width: 100%; display: block; }
    .perfil { display: flex; justify-content: center; padding: 16px; }
    .perfil img { width: 100%; max-width: 420px; border-radius: 12px; display: block; }
  </style>
</head>
<body>
  <div class="banner">
    <img src="images/capa.png" alt="Banner do perfil da Dudinha">
  </div>
  <div class="perfil">
    <img src="images/540797a2f501dafa106499a8ef3208ed.jpg" alt="Foto de perfil da Dudinha">
  </div>
</body>
</html>
