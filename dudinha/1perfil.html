<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Perfil da Dudinha</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #111; font-family: Arial, sans-serif; }
    .banner img { width: 100%; display: block; }
    .perfil { display: flex; flex-direction: column; align-items: center; padding: 16px; }
    .perfil img { width: 100%; max-width: 420px; border-radius: 12px; display: block; }
    .nome { color: #fff; font-size: 26px; font-weight: bold; margin: 14px 0 4px; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div class="banner">
    <img src="images/capa.png" alt="Banner do perfil da Dudinha">
  </div>
  <div class="perfil">
    <img src="images/dudinha.jpg" alt="Foto de perfil da Dudinha">
    <div class="nome">DUDINHA</div>
  </div>
</body>
</html>
